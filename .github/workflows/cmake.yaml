name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure tests
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCRDT_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic'
      - name: Build tests
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$PWD/stage"
      - name: Configure package consumer
        run: >-
          cmake -S tests/package-consumer -B package-consumer-build
          -DCMAKE_PREFIX_PATH="$PWD/stage"
      - name: Build package consumer
        run: cmake --build package-consumer-build --parallel
      - name: Run package consumer
        run: ./package-consumer-build/package-consumer
